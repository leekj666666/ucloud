rule_files:
  - /etc/prometheus/rules.yml
evaluation_interval: 5s
tests:
  - name: active OOM triggers and clears
    interval: 5s
    input_series:
      - series: 'cloudsre_active_oom{namespace="sre-demo",service="inventory"}'
        values: '0 1 1 1 0 0 0'
    alert_rule_test:
      - eval_time: 15s
        alertname: WorkloadOOM
        exp_alerts:
          - exp_labels:
              namespace: sre-demo
              service: inventory
              environment: demo
              severity: warning
            exp_annotations:
              summary: A non-ready business container was OOM killed
      - eval_time: 30s
        alertname: WorkloadOOM
        exp_alerts: []
  - name: sustained P95 latency triggers
    interval: 5s
    input_series:
      - series: 'sre_http_duration_seconds_bucket{namespace="sre-demo",service="order",route="/orders",le="1"}'
        values: '0+0x24'
      - series: 'sre_http_duration_seconds_bucket{namespace="sre-demo",service="order",route="/orders",le="2.5"}'
        values: '0+10x24'
      - series: 'sre_http_duration_seconds_bucket{namespace="sre-demo",service="order",route="/orders",le="+Inf"}'
        values: '0+10x24'
    alert_rule_test:
      - eval_time: 60s
        alertname: BusinessLatencyHigh
        exp_alerts:
          - exp_labels:
              namespace: sre-demo
              service: order
              environment: demo
              severity: warning
            exp_annotations:
              summary: Business request P95 exceeds one second
