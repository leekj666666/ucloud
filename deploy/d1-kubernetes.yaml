apiVersion: v1
kind: Namespace
metadata:
  name: sre-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      annotations:
        cloudsre/image-id: sha256:32f28ad171348fbbf93859aea1d776899610a80b55e10c3ca494eb34cde659c8
      labels:
        app: inventory
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - uvicorn
        - cloudsre.demo_serve:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        env:
        - name: SERVICE_ROLE
          value: inventory
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: demo-db
        - name: RELEASE_ID
          value: v20261023.1
        image: cloudsre-app:d1-complete
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        name: inventory
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 192Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: sre-demo
spec:
  ports:
  - nodePort: 30081
    port: 8000
    targetPort: 8000
  selector:
    app: inventory
  type: NodePort
---
