---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: sre-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-logs
  namespace: sre-demo
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: sre-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-logs
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: sre-demo
---
apiVersion: v1
data:
  config.alloy: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  namespaces {\
    \ names = [\"sre-demo\"] }\n  selectors {\n    role = \"pod\"\n    label = \"\
    app in (gateway,order,inventory,probe)\"\n  }\n}\ndiscovery.relabel \"logs\" {\n\
    \  targets = discovery.kubernetes.pods.targets\n  rule {\n    source_labels =\
    \ [\"__meta_kubernetes_pod_label_app\"]\n    target_label = \"service\"\n  }\n\
    \  rule {\n    source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label\
    \ = \"namespace\"\n  }\n}\nloki.source.kubernetes \"pods\" {\n  targets = discovery.relabel.logs.output\n\
    \  forward_to = [loki.write.local.receiver]\n}\nloki.write \"local\" {\n  endpoint\
    \ { url = \"http://172.19.0.5:3100/loki/api/v1/push\" }\n}\n"
kind: ConfigMap
metadata:
  name: alloy
  namespace: sre-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        cloudsre/config-hash: bb075fc926a151ff5b859561adcc3a4f4b2ad96c9d5fdd50c8ac93525fd53a7e
      labels:
        app: alloy
    spec:
      containers:
      - args:
        - run
        - --storage.path=/tmp/alloy
        - /etc/alloy/config.alloy
        image: cloudsre-alloy:d1
        imagePullPolicy: Never
        name: alloy
        resources:
          limits:
            cpu: 300m
            memory: 192Mi
          requests:
            cpu: 20m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
      serviceAccountName: alloy
      volumes:
      - configMap:
          name: alloy
        name: config
