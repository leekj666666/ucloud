name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SRE_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts diagnosis
      - run: uv run pytest tests -q
      - run: docker build -t cloudsre-app:ci -f deploy/Dockerfile .
      - run: docker run --rm --entrypoint python cloudsre-app:ci -c "from cloudsre.demo import create_demo; from cloudsre.probe import app"
