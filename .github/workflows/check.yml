name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SRE_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PYTHONPATH: backend
      SRE_CI_EVIDENCE_DIR: ci-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize persistent CI evidence
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/commit.txt
          uname -a > ci-evidence/runner.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts diagnosis benchmarks
      - name: Test with real PostgreSQL and retain JUnit
        run: uv run pytest tests -q -ra --junitxml=ci-evidence/pytest.xml
      - name: Require complete test execution
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('ci-evidence/pytest.xml').getroot().iter('testcase'))
          assert len(cases) >= 175, 'D5 requires the complete D4 regression and budget/protocol/E2E/archive checks'
          assert all(not any(c.tag in {'skipped', 'failure', 'error'} for c in case) for case in cases), 'Skipped or non-passing tests are not accepted'
          required = {
              'test_postgres_gateway_verification_and_parallel_isolation',
              'test_postgres_concurrent_same_key_only_deducts_once',
          }
          actual = {case.attrib['name'] for case in cases if 'test_postgres_business' in case.attrib.get('classname', '')}
          assert required <= actual, 'Both real PostgreSQL integration tests must run'
          durable = {case.attrib['name'] for case in cases if 'test_durable_postgres' in case.attrib.get('classname', '')}
          assert {
              'test_same_resource_queues_and_independent_resources_overlap',
              'test_two_event_checkpoints_run_concurrently',
              'test_intent_conflict_rolls_back_state_journal_and_audit',
              'test_released_owner_cannot_commit_and_epoch_increases',
              'test_killed_worker_releases_lease_and_retains_atomic_intent',
              'test_server_session_termination_fences_old_connection',
          } <= durable, 'All real PostgreSQL durable workflow cases must run'
          control = {case.attrib['name'] for case in cases if 'test_controls_postgres' in case.attrib.get('classname', '')}
          assert {
              'test_concurrent_create_has_one_control_and_one_audit',
              'test_opposite_decisions_race_has_one_immutable_winner',
              'test_stop_accepted_before_dispatch_prevents_write',
              'test_stop_waits_for_inflight_dispatch_and_fences_following_write',
              'test_pending_control_task_is_not_starved_by_uncontrolled_alerts',
          } <= control, 'All five real PostgreSQL operator-control cases must run'
          cancel = [case for case in cases if 'test_diagnostic_cancellation' in case.attrib.get('classname', '')]
          assert len(cancel) == 3, 'All three real process cancellation cases must run'
          budget = {case.attrib['name'] for case in cases if 'test_model_budget_socket' in case.attrib.get('classname', '')}
          assert 'test_budget_counts_real_local_upstream_http_and_rejects_concurrent_overflow' in budget, 'The real local HTTP budget/concurrency test must run'
          print(f'{len(cases)} tests passed, zero skipped; business and durable PostgreSQL cases verified')
          PY
      - run: docker build -t cloudsre-app:ci -f deploy/Dockerfile .
      - run: docker run --rm --entrypoint python cloudsre-app:ci -c "from cloudsre.demo import create_demo; from cloudsre.probe import app"
      - run: uv run python scripts/build_d3_manifest.py
      - run: docker build -t cloudsre-agent:ci -f deploy/Dockerfile.d3 .
      - run: docker run --rm -e CLOUDSRE_DIAG_WORK=/tmp/diagnoses --entrypoint python cloudsre-agent:ci -c "from cloudsre.worker_v3 import process; from cloudsre.diagnosis_jobs import app"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build locked console frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: uv run python scripts/build_d3_manifest.py
      - run: docker build -t cloudsre-agent:d4-ci -f deploy/Dockerfile.d4 .
      - run: docker run --rm -e CLOUDSRE_DIAG_WORK=/tmp/diagnoses --entrypoint python cloudsre-agent:d4-ci -c "from pathlib import Path; from cloudsre.worker_v3 import process; from cloudsre.diagnosis_jobs import app; assert Path('/app/frontend/dist/index.html').is_file()"
      - run: uv run python scripts/build_d5_manifest.py
      - run: docker build --build-arg BASE_IMAGE=cloudsre-agent:d4-ci -t cloudsre-agent:d5-ci -f deploy/Dockerfile.d5 .
      - name: Verify D5 diagnostic image excludes evaluator and credentials
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp:rw,size=16m --cap-drop ALL --security-opt no-new-privileges --entrypoint python cloudsre-agent:d5-ci - <<'PY' | tee ci-evidence/d5-image-isolation.txt
          from pathlib import Path
          import os
          from cloudsre.model_budget import create_proxy
          from cloudsre.experiment_variants import settings
          assert settings('B1')['max_provider_attempts'] == 1
          for name in ('/app/benchmarks', '/app/evaluation', '/app/scripts', '/app/infra/.generated', '/var/run/docker.sock'):
              assert not Path(name).exists(), name
          assert not any(os.environ.get(key) for key in ('DEEPSEEK_API_KEY', 'OPENAI_API_KEY', 'CLOUDSRE_DIAG_TOKEN', 'DATABASE_URL'))
          print('D5 image imports and isolation passed')
          PY
          python -c "from pathlib import Path; assert 'D5 image imports and isolation passed' in Path('ci-evidence/d5-image-isolation.txt').read_text()"
      - name: Install Chromium for browser contracts
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser contracts on isolated test data
        working-directory: frontend
        run: npm run test:browser
      - name: Require all browser contracts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('ci-evidence/browser-junit.xml').getroot().iter('testcase'))
          assert len(cases) == 12
          assert all(not any(c.tag in {'skipped', 'failure', 'error'} for c in case) for case in cases)
          PY
      - name: Validate OOM and latency alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/rules.yml:/etc/prometheus/rules.yml:ro" -v "$PWD/tests/prometheus_d3.yml:/tests/rules.yml:ro" prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 test rules /tests/rules.yml
      - name: Archive test and service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
