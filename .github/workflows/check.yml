name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SRE_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PYTHONPATH: backend
      SRE_CI_EVIDENCE_DIR: ci-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize persistent CI evidence
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/commit.txt
          uname -a > ci-evidence/runner.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts diagnosis
      - name: Test with real PostgreSQL and retain JUnit
        run: uv run pytest tests -q -ra --junitxml=ci-evidence/pytest.xml
      - name: Require complete test execution
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('ci-evidence/pytest.xml').getroot().iter('testcase'))
          assert len(cases) >= 21, 'D1 baseline requires at least 21 tests'
          assert all(not any(c.tag in {'skipped', 'failure', 'error'} for c in case) for case in cases), 'Skipped or non-passing tests are not accepted'
          required = {
              'test_postgres_gateway_verification_and_parallel_isolation',
              'test_postgres_concurrent_same_key_only_deducts_once',
          }
          actual = {case.attrib['name'] for case in cases if 'test_postgres_business' in case.attrib.get('classname', '')}
          assert required <= actual, 'Both real PostgreSQL integration tests must run'
          print(f'{len(cases)} tests passed, zero skipped; both real PostgreSQL cases verified')
          PY
      - run: docker build -t cloudsre-app:ci -f deploy/Dockerfile .
      - run: docker run --rm --entrypoint python cloudsre-app:ci -c "from cloudsre.demo import create_demo; from cloudsre.probe import app"
      - name: Archive test and service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
