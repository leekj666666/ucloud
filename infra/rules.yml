groups:
- name: demo
  rules:
  - alert: OrderErrors
    annotations:
      summary: Order requests are failing
    expr: sum by(namespace)(rate(sre_http_requests_total{service="order",status=~"5.."}[30s]))
      > 0.1
    for: 10s
    labels:
      environment: demo
      service: order
      severity: warning
  - alert: DemoTargetDown
    annotations:
      summary: DemoTargetDown
    expr: up{job=~"demo|demo-b"} == 0
    for: 10s
    labels:
      environment: demo
      severity: warning
  - alert: BusinessProbeFailed
    annotations:
      summary: BusinessProbeFailed
    expr: sre_business_probe_success == 0
    for: 10s
    labels:
      environment: demo
      service: order
      severity: warning
  - alert: BusinessProbeStale
    annotations:
      summary: BusinessProbeStale
    expr: time() - sre_business_probe_last_completed_unixtime > 30
    for: 10s
    labels:
      environment: demo
      service: order
      severity: warning
  - alert: GatewayErrors
    annotations:
      summary: GatewayErrors
    expr: sum by(namespace)(rate(sre_http_requests_total{service="gateway",status=~"5.."}[30s]))
      > 0.1
    for: 10s
    labels:
      environment: demo
      service: gateway
      severity: warning
  - alert: WorkloadOOM
    expr: cloudsre_active_oom == 1
    for: 10s
    labels:
      environment: demo
      severity: warning
    annotations:
      summary: A non-ready business container was OOM killed
  - alert: BusinessLatencyHigh
    expr: histogram_quantile(0.95, sum by (le, namespace, service) (rate(sre_http_duration_seconds_bucket{route="/orders"}[1m])))
      > 1
    for: 10s
    labels:
      environment: demo
      severity: warning
    annotations:
      summary: Business request P95 exceeds one second
