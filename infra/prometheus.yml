alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
global:
  evaluation_interval: 5s
  scrape_interval: 5s
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: demo
  static_configs:
  - labels:
      service: order
      namespace: sre-demo
    targets:
    - sre-dev-control-plane:30080
  - labels:
      service: inventory
      namespace: sre-demo
    targets:
    - sre-dev-control-plane:30081
  - labels:
      service: gateway
      namespace: sre-demo
    targets:
    - sre-dev-control-plane:30082
  - labels:
      service: probe
      namespace: sre-demo
    targets:
    - sre-dev-control-plane:30083
- job_name: sre-resource-health
  static_configs:
  - targets:
    - cloudsre-diagnosis-d3:8080
  honor_labels: true
- job_name: demo-b
  static_configs:
  - labels:
      service: order
      namespace: sre-demo-b
    targets:
    - sre-dev-control-plane:30090
  - labels:
      service: inventory
      namespace: sre-demo-b
    targets:
    - sre-dev-control-plane:30091
  - labels:
      service: gateway
      namespace: sre-demo-b
    targets:
    - sre-dev-control-plane:30092
  - labels:
      service: probe
      namespace: sre-demo-b
    targets:
    - sre-dev-control-plane:30093
