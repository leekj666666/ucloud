alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
global:
  evaluation_interval: 5s
  scrape_interval: 5s
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: demo
  static_configs:
  - labels:
      service: order
    targets:
    - sre-dev-control-plane:30080
  - labels:
      service: inventory
    targets:
    - sre-dev-control-plane:30081
  - labels:
      service: gateway
    targets:
    - sre-dev-control-plane:30082
  - labels:
      service: probe
    targets:
    - sre-dev-control-plane:30083
